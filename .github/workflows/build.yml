name: Build (Windows)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build with PyInstaller
        shell: pwsh
        run: .\build.ps1

      - name: Package artifact
        shell: pwsh
        run: |
          if (Test-Path Ominis-windows.zip) { Remove-Item Ominis-windows.zip }
          Compress-Archive -Path dist\Ominis\* -DestinationPath Ominis-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ominis-windows
          path: Ominis-windows.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ominis-windows.zip
